# Site settings
title:          Just Notes
description:    "Another boring blog from a lazy blogger"
url:            "https://xspring.github.io"

# Google Analytics
google_analytics: G-JD5BTL7C4N

# Author
author:
  name:         LD
  url:          
  email:        

# Build settings
markdown:       kramdown
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

# Disqus (Set to your disqus id)
disqus:         jekyll-tale

mermaid: true
future: true
